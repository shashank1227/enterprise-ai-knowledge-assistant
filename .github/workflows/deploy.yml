name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: latest

  # Auto-deploy main → staging after CI completes
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Always runs so the workflow never fails with "No jobs were run".
  gate:
    name: Deploy gate
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      environment: ${{ steps.gate.outputs.environment }}
      image_tag: ${{ steps.gate.outputs.image_tag }}
      event_name: ${{ github.event_name }}
    steps:
      - name: Decide whether to deploy
        id: gate
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          TAG="${{ github.event.inputs.image_tag || github.event.workflow_run.head_sha || 'latest' }}"
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual deploy requested → ${ENV} (tag=${TAG})"
            exit 0
          fi

          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "CI succeeded — deploying to ${ENV} (tag=${TAG})"
            exit 0
          fi

          echo "deploy=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping deploy because CI conclusion was '${{ github.event.workflow_run.conclusion }}'"

  deploy:
    name: Deploy to ${{ needs.gate.outputs.environment }}
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.gate.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets
        id: secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          [ -z "$DEPLOY_HOST" ] && missing+=("DEPLOY_HOST")
          [ -z "$DEPLOY_USER" ] && missing+=("DEPLOY_USER")
          [ -z "$DEPLOY_SSH_KEY" ] && missing+=("DEPLOY_SSH_KEY")

          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          msg="Missing GitHub Actions secrets: ${missing[*]}. Add them under Settings → Environments → ${{ needs.gate.outputs.environment }} (or repository Secrets)."

          # Manual deploys should fail loudly; auto-deploys after CI should soft-skip.
          if [ "${{ needs.gate.outputs.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::$msg"
            exit 1
          fi

          echo "::notice::$msg"
          echo "::notice::SSH deploy skipped until DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY are configured."

      - name: Deploy via SSH
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/knowledge-assistant

            # Pull latest images
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export IMAGE_TAG=${{ needs.gate.outputs.image_tag }}
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}

            docker compose pull backend frontend
            docker compose up -d --no-build backend frontend nginx

            # Wait for health
            echo "Waiting for backend health..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Backend healthy"
                break
              fi
              [ $i -eq 12 ] && echo "Timeout waiting for health" && exit 1
              sleep 10
            done

            docker image prune -f
            echo "Deployment complete"
