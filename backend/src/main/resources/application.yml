spring:
  application:
    name: enterprise-knowledge-assistant

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/knowledge_db}
    username: ${DATABASE_USERNAME:knowledge_user}
    password: ${DATABASE_PASSWORD:knowledge_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: KnowledgeHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      connection-test-query: SELECT 1
      data-source-properties:
        socketTimeout: 30

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages DDL
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  cache:
    type: redis
    redis:
      time-to-live: 3600000          # 1 hour default TTL
      cache-null-values: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:200MB}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ── Application Config ─────────────────────────────────────

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-must-be-256-bits-long-at-minimum}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}      # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days

  openai:
    api-key: ${OPENAI_API_KEY}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4.1}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: 1536
    max-tokens: ${OPENAI_MAX_TOKENS:2000}
    temperature: 0.2
    timeout-seconds: 60
    max-retries: 3

  rag:
    chunk-size-tokens: ${RAG_CHUNK_SIZE:512}
    chunk-overlap-tokens: ${RAG_CHUNK_OVERLAP:50}
    top-k-retrieval: ${RAG_TOP_K:5}
    max-context-tokens: ${RAG_MAX_CONTEXT:8000}
    search-mode: ${RAG_SEARCH_MODE:HYBRID}           # HYBRID | VECTOR | KEYWORD
    min-relevance-score: 0.3
    confidence-threshold: 0.7

  storage:
    type: ${STORAGE_TYPE:s3}                         # s3 | local
    s3:
      bucket: ${S3_BUCKET:enterprise-knowledge-docs}
      region: ${AWS_REGION:us-east-1}
      prefix: documents/
      presigned-url-expiry-minutes: 60
    local:
      upload-dir: ${LOCAL_UPLOAD_DIR:/tmp/knowledge-uploads}

  rate-limit:
    enabled: true
    chat:
      requests-per-minute: ${RATE_LIMIT_CHAT_RPM:20}
    upload:
      requests-per-minute: ${RATE_LIMIT_UPLOAD_RPM:10}
    global:
      requests-per-minute: ${RATE_LIMIT_GLOBAL_RPM:100}

  security:
    cors:
      allowed-origins:
        - ${FRONTEND_URL:http://localhost:5173}
        - https://knowledge.enterprise.com
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
    oauth2:
      enabled: ${OAUTH2_ENABLED:false}
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}

# ── Server ─────────────────────────────────────────────────

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  http2:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# ── Actuator / Monitoring ───────────────────────────────────

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

# ── Logging ────────────────────────────────────────────────

logging:
  level:
    com.enterprise.knowledge: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    dev.langchain4j: ${LOG_LEVEL_LC4J:INFO}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId},%X{spanId}]){cyan} %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId},%X{spanId}] ${PID:- } --- [%t] %-40.40logger{39} : %m%n"
  file:
    name: ${LOG_FILE:/var/log/knowledge-assistant/app.log}
