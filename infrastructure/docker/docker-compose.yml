version: "3.9"

# ── Local development stack ────────────────────────────────
# Starts: PostgreSQL 16 + pgvector, Redis 7, backend, frontend dev server
#
# Usage:
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#   docker compose -f infrastructure/docker/docker-compose.yml logs -f backend
#
# Prerequisites:
#   - Copy .env.example → .env and fill in OPENAI_API_KEY
#   - First run: `docker compose ... up -d postgres` then wait for
#     the healthcheck before starting the rest

services:

  # ── PostgreSQL 16 with pgvector ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: knowledge_user
      POSTGRES_PASSWORD: knowledge_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_user -d knowledge_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ka_net

  # ── Redis 7 ────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: ka_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ka_net

  # ── Spring Boot backend ────────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: ka_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/knowledge_db
      DATABASE_USERNAME: knowledge_user
      DATABASE_PASSWORD: knowledge_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-256-bits-long}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      LOCAL_UPLOAD_DIR: /app/uploads
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      SERVER_PORT: 8080
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/var/log/knowledge-assistant
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ka_net

  # ── Vite frontend dev server ───────────────────────────
  frontend:
    image: node:22-alpine
    container_name: ka_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api/v1
    depends_on:
      - backend
    networks:
      - ka_net

  # ── Nginx reverse proxy ────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ka_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    networks:
      - ka_net

  # ── Prometheus ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: ka_prometheus
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - ka_net

  # ── Grafana ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: ka_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - ka_net

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:
  prometheus_data:
  grafana_data:

networks:
  ka_net:
    driver: bridge
