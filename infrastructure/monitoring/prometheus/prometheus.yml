global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    environment: local
    application: knowledge-assistant

# ── Alerting ───────────────────────────────────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ── Rule files ─────────────────────────────────────────────
rule_files:
  - "rules/*.yml"

# ── Scrape targets ─────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot backend (Micrometer → Prometheus)
  - job_name: knowledge-assistant-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: backend

  # Node Exporter (host metrics — add container if needed)
  # - job_name: node-exporter
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # PostgreSQL exporter
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis exporter
  # - job_name: redis
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
